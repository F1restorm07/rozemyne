[workspace]
members = [
    "backend/core",
    "backend/graphql",
    "backend/types",
]
resolver = "3"

[workspace.dependencies]
uuid = { version = "1.26", features = ["v7"] } # database identifiers
serde = { version = "1", features = ["derive"] }
highway = "1.3" # file checksum
cynic = "3.14" # graphql client
arrow = "60"
parquet = "60"
tracing = "0.1" # logging
tracing-subscriber = "0.3"
exn = "0.3" # error handling (@todo: replace with `snafu`)
bevy_ecs = { version = "0.20", default-features = false, features = ["std", "async_executor"] }
bevy_asset = "0.20"
bevy_reflect = "0.20"
enumset = "1.1"
num_enum = "0.7"
derive_builder = "0.20"
ureq = "3.4"
governor = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
uncased = "0.9"
phf = { version = "0.14", features = ["macros", "uncased"] }
regex = "1.13"
strum = { version = "0.28", features = ["derive"] }
unicode-general-category = "1.1"
unicode-bidi-mirroring = "0.4"
itertools = "0.15"
roman-numerals-rs = "4.1"
logos = "0.16"
crossbeam = "0.8"
interpolator = { version = "0.5", features = ["number"] }
bpaf = { version = "0.9", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "send"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
codegen-units = 1
